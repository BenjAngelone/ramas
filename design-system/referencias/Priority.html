<!-- @dsCard group="Etiquetas" height=150 width=960 subtitle="Barras 4/3/2/1 + palabra" -->
<!doctype html>
<html data-theme="dark" lang="es">
<head><meta name="viewport" content="width=960"><link rel="stylesheet" href="../css/ramas-tokens.css"><link rel="stylesheet" href="../css/ramas-components.css"><script src="../js/ramas-templates.js"></script>
<meta charset="utf-8">
<title>Prioridad</title>
<style>
  body { background: var(--color-bg-3); padding: var(--space-6); display: grid; gap: var(--space-4); }
  .row { display: flex; gap: var(--space-6); align-items: center; }
  .row > .rm-label { width: 140px; color: var(--color-text-3); }
  select.rm-select { width: 180px; }
</style>
</head>
<body>
<div class="row" id="a"><span class="rm-label">Niveles</span></div>
<div class="row" id="b"><span class="rm-label">Solo glifo</span></div>
<script>
  var R = window.Ramas, P = ['urgent', 'high', 'medium', 'low'];
  document.getElementById('a').insertAdjacentHTML('beforeend', P.map(function (p) { return R.prio(p); }).join(''));
  document.getElementById('b').insertAdjacentHTML('beforeend', P.map(function (p) { return R.prio(p, { bare: true }); }).join('') + '<span class="rm-faint" style="font-size:12px">Compacto (tooltip con la palabra). Solo en mobile y minimapa.</span>');
</script>
</body>
</html>
