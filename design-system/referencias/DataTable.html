<!doctype html>
<html data-theme="dark" lang="es">
<head><meta name="viewport" content="width=960"><link rel="stylesheet" href="../css/ramas-tokens.css"><link rel="stylesheet" href="../css/ramas-components.css"><script src="../js/ramas-templates.js"></script>
<meta charset="utf-8">
<title>Tabla</title>
<style>
  body { background: var(--color-bg-2); padding: var(--space-6); display: grid; grid-template-columns: 2fr 1fr; gap: var(--space-6); align-items: start; }
</style>
</head>
<body>
<table class="rm-table" id="t"></table>
<table class="rm-table"><thead><tr><th>Idea</th><th class="num">Avance</th></tr></thead><tbody><tr><td colspan="2" class="rm-table__empty">No hay ideas con este filtro.<br><button class="rm-btn rm-btn--ghost rm-btn--sm" style="margin-top:8px">Limpiar filtros</button></td></tr></tbody></table>
<script>
  var R = window.Ramas;
  var rows = [['R-3', 'Modelo de turnos y disponibilidad', 'doing', 'claude', '6h 40m', ''], ['R-2', 'Webhook de WhatsApp Cloud API', 'review', 'benja', '3h 20m', 'is-hover'], ['R-6', 'Tabla de slots', 'done', 'claude', '2h 15m', 'is-selected'], ['R-7', 'Bloqueo por feriados', 'todo', 'benja', '—', '']];
  document.getElementById('t').innerHTML = '<thead><tr><th>Id</th><th>Nodo</th><th>Estado</th><th>Responsable</th><th class="num is-sorted">Tiempo</th></tr></thead><tbody>' +
    rows.map(function (r) { return '<tr class="' + r[5] + '"><td class="rm-id">' + r[0] + '</td><td>' + r[1] + '</td><td>' + R.pill(r[2]) + '</td><td>' + R.who(r[3]) + '</td><td class="num">' + r[4] + '</td></tr>'; }).join('') + '</tbody>';
</script>
</body>
</html>
